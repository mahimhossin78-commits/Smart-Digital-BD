<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101827"><title>Admin Panel | Smart Digital BD</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:1100px;margin:40px auto;padding:20px}.admin-box{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #10203012;margin:18px 0}.admin-form{display:grid;gap:12px;max-width:480px}.admin-form input{padding:13px;border:1px solid #ccd3df;border-radius:9px;width:100%}.orders{display:grid;gap:14px}.order-card{border:1px solid #e1e5ec;border-radius:12px;padding:16px;overflow-wrap:anywhere}.order-card h3{margin:0 0 8px}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.order-actions button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.accept{background:#d7f8e3;color:#126b37}.reject{background:#ffe0e0;color:#a11b1b}.logout{background:#e8edf5;color:#172033}.muted{color:#697386}.hidden{display:none!important}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">SD</span><span><strong>Smart Digital BD</strong><small>Admin Panel</small></span></a><nav><a href="index.html">ওয়েবসাইট</a></nav></header>
<main class="admin-wrap"><h1>অ্যাডমিন প্যানেল</h1><p class="muted">শুধু অনুমোদিত অ্যাডমিন লগইন করে অর্ডার দেখতে এবং অ্যাকসেপ্ট/রিজেক্ট করতে পারবেন।</p>
<section id="loginBox" class="admin-box"><h2>অ্যাডমিন লগইন</h2><form id="loginForm" class="admin-form"><label>ইমেইল<input id="email" type="email" required autocomplete="username"></label><label>পাসওয়ার্ড<input id="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary" type="submit">লগইন</button><p id="loginMessage" role="status"></p></form></section>
<section id="dashboard" class="admin-box hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>সব অর্ডার</h2><button id="logoutBtn" class="order-actions logout">লগআউট</button></div><p id="adminMessage" role="status"></p><div id="ordersList" class="orders"></div></section></main>
<script type="module" src="admin.js"></script></body></html>
